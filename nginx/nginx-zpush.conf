server {
    listen ${ZPUSH_BIND_ADDRESS}:${ZPUSH_HTTP_PORT} default_server;

    server_name _;

    server_tokens off;

    # Z-Push lives here
    root /var/www/zpush;
    index index.php;

    # health endpoint
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Only expose Z-Push endpoints explicitly
    location = /Microsoft-Server-ActiveSync {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/zpush/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PATH_INFO /Microsoft-Server-ActiveSync;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        client_max_body_size ${NGINX_CLIENT_MAX_BODY_SIZE};
        # EAS devices keep long-lived connections. Increase read timeouts.
        proxy_read_timeout 3600s;
        fastcgi_read_timeout 3600s;
    }

    # The autodiscover entry is autodiscover/autodiscover.php, NOT index.php.
    # Pointing both endpoints at index.php (as upstream does) routes
    # autodiscover requests into Z-Push's main EAS handler, which then
    # 500s with "Requested the Z-Push URL without the required GET
    # parameters" because the EAS handler expects Cmd=… query params.
    location ~* ^/autodiscover/Autodiscover\.xml$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/zpush/autodiscover/autodiscover.php;
        fastcgi_param SCRIPT_NAME /autodiscover/autodiscover.php;
        fastcgi_param PATH_INFO /autodiscover/Autodiscover.xml;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        client_max_body_size ${NGINX_CLIENT_MAX_BODY_SIZE};
        proxy_read_timeout 60s;
        fastcgi_read_timeout 60s;
    }

    # Deny everything else by default.
    location / {
        return 404;
    }
}
