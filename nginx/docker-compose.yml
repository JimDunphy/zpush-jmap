services:
  stalwart-sync:
    build:
      context: ..
      dockerfile: nginx/Dockerfile
      network: ${ZPUSH_BUILD_NETWORK:-default}
    image: ${ZPUSH_IMAGE:-local/zpush:latest}
    network_mode: host
    environment:
      - ZPUSH_BIND_ADDRESS=${ZPUSH_BIND_ADDRESS:-127.0.0.1}
      - ZPUSH_HTTP_PORT=${ZPUSH_HTTP_PORT:-10000}
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT:-256M}
      - PHP_UPLOAD_MAX_FILESIZE=${PHP_UPLOAD_MAX_FILESIZE:-50M}
      - PHP_POST_MAX_SIZE=${PHP_POST_MAX_SIZE:-50M}
      - PHP_MAX_EXECUTION_TIME=${PHP_MAX_EXECUTION_TIME:-3600}
      - PHP_MAX_INPUT_TIME=${PHP_MAX_INPUT_TIME:-3600}
      - NGINX_CLIENT_MAX_BODY_SIZE=${NGINX_CLIENT_MAX_BODY_SIZE:-50m}
      - STALWART_URL=${STALWART_URL:-http://localhost:10080}
      - STALWART_BACKEND_VERSION=${STALWART_BACKEND_VERSION:-dev}
      - STALWART_SSL_VERIFYPEER=${STALWART_SSL_VERIFYPEER:-true}
      - STALWART_SSL_VERIFYHOST=${STALWART_SSL_VERIFYHOST:-true}
      - STALWART_ALLOW_INSECURE_HTTP=${STALWART_ALLOW_INSECURE_HTTP:-false}
      - STALWART_CONNECT_TIMEOUT_SECS=${STALWART_CONNECT_TIMEOUT_SECS:-10}
      - STALWART_REQUEST_TIMEOUT_SECS=${STALWART_REQUEST_TIMEOUT_SECS:-60}
      - STALWART_BLOB_TIMEOUT_SECS=${STALWART_BLOB_TIMEOUT_SECS:-180}
      - STALWART_PUSH_CHANGES_ENABLED=${STALWART_PUSH_CHANGES_ENABLED:-true}
      - STALWART_PUSH_EVENT_TYPES=${STALWART_PUSH_EVENT_TYPES:-Mailbox,Email,ContactCard,CalendarEvent}
      - STALWART_PUSH_CLOSEAFTER=${STALWART_PUSH_CLOSEAFTER:-state}
      - STALWART_PUSH_PING_SECS=${STALWART_PUSH_PING_SECS:-30}
      - STALWART_ABQ_ENABLED=${STALWART_ABQ_ENABLED:-false}
      - STALWART_ABQ_ALLOWED_RULES=${STALWART_ABQ_ALLOWED_RULES:-}
      - STALWART_ABQ_BLOCKED_RULES=${STALWART_ABQ_BLOCKED_RULES:-}
      - STALWART_ABQ_QUARANTINED_RULES=${STALWART_ABQ_QUARANTINED_RULES:-}
      - STALWART_ABQ_QUARANTINE_BY_DEFAULT=${STALWART_ABQ_QUARANTINE_BY_DEFAULT:-false}
    volumes:
      - ./zpush/config:/data/config
      - ./zpush/state:/data/state
      - ./zpush/log:/data/log
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${ZPUSH_HTTP_PORT:-10000}/healthz || curl -fsS http://${ZPUSH_BIND_ADDRESS:-127.0.0.1}:${ZPUSH_HTTP_PORT:-10000}/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
